# Installed by scripts/50-unbound-dns.sh at
# /etc/systemd/system/unbound.service.d/vpn-tunnel-order.conf
#
# unbound.conf.d/vpn-tunnel.conf binds unbound to the WireGuard/OpenVPN
# tunnel addresses (10.66.0.1, 10.77.0.1). Those addresses don't exist until
# wg-quick@wg0 and the two openvpn-server@ instances have brought their
# interfaces up — without this ordering, a cold boot can start unbound
# first and it fails to bind ("Cannot assign requested address"), silently
# breaking DNS for every tunnel client until someone notices and restarts
# it by hand.
[Unit]
After=wg-quick@wg0.service openvpn-server@server-udp.service openvpn-server@server-tcp.service
Wants=wg-quick@wg0.service openvpn-server@server-udp.service openvpn-server@server-tcp.service
