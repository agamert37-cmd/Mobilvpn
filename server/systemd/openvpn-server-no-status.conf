# Drop-in for openvpn-server@.service — installed by
# scripts/30-openvpn-setup.sh as
# /etc/systemd/system/openvpn-server@.service.d/no-status.conf
#
# Ubuntu's stock unit hardcodes a status file into ExecStart:
#
#   ExecStart=/usr/sbin/openvpn --status %t/openvpn-server/status-%i.log \
#             --status-version 2 --suppress-timestamps --config %i.conf
#
# That file is rewritten continuously and, measured against a real
# openvpn 2.6.19 with a client connected, contains:
#
#   CLIENT_LIST,client1,203.0.113.9:43271,10.77.0.2,,3142,3148,<time>,...
#   ROUTING_TABLE,10.77.0.2,client1,203.0.113.9:43271,<time>,...
#
# i.e. real public IP <-> assigned tunnel IP <-> common name <-> timestamp:
# a complete attribution record for every connected user. It lives on
# tmpfs so it does not survive a reboot, but it is readable for the whole
# uptime of the box and is exactly the artefact a no-logs VPN must not
# keep.
#
# vpn-api never reads this file — it queries the management socket, which
# generates the same data on demand and keeps it in memory only. Verified
# against a real daemon: with no --status at all, `status 2` over the
# management socket still returns the byte counters telemetry needs.
#
# The empty ExecStart= is required: systemd only allows ExecStart to be
# reset (not appended to) by clearing it first.
[Service]
ExecStart=
ExecStart=/usr/sbin/openvpn --suppress-timestamps --config %i.conf
